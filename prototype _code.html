<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmFusion — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#22461F;
    --forest-dark:#152D13;
    --forest-soft:#3A6035;
    --marigold:#E8A33D;
    --marigold-dark:#C97F1E;
    --marigold-light:#FBE4BC;
    --cream:#FBF7ED;
    --paper:#F4EEDC;
    --soil:#3A2C20;
    --soil-light:#7A6A57;
    --sky:#5B93A0;
    --white:#FFFFFF;
    --danger:#BE4530;
    --danger-light:#F6DCD4;
    --success:#4C7A3D;
    --success-light:#E1EDD8;
    --line:#E6DCC4;
    --shadow: 0 10px 30px -12px rgba(58,44,32,0.25);
    --radius: 18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: transparent;
    font-family:'Manrope', sans-serif;
    color:var(--soil);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh;
    padding: 18px 8px;
  }
  .stage{ display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
  /* ---------- device frame ---------- */
  .device{
    width:390px; height:820px;
    background:var(--soil);
    border-radius:46px;
    padding:12px;
    box-shadow: var(--shadow);
    position:relative;
    flex-shrink:0;
  }
  .device .screen{
    width:100%; height:100%;
    background:var(--cream);
    border-radius:36px;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:var(--soil); border-radius:0 0 16px 16px; z-index:50;
  }
  .statusbar{
    height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding: 6px 26px 0 26px; font-size:12px; font-weight:700; color:var(--soil); font-family:'Space Mono',monospace;
  }
  .app-body{ flex:1; overflow-y:auto; position:relative; scrollbar-width:none; }
  .app-body::-webkit-scrollbar{ display:none; }

  /* furrow texture — signature motif */
  .furrow{
    background-image: repeating-linear-gradient( -18deg, rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 1.5px, transparent 1.5px, transparent 13px );
  }

  /* ---------- top app headers ---------- */
  .topbar{
    padding:18px 20px 16px; background:var(--forest); color:var(--white); position:relative; overflow:hidden;
  }
  .topbar.small{ padding:16px 18px 14px; }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:2;}
  .topbar h1{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; letter-spacing:0.2px; }
  .topbar .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; opacity:0.75; font-weight:700; margin-bottom:2px;}
  .iconbtn{
    width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.14); border:none;
    display:flex; align-items:center; justify-content:center; color:var(--white); cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{ background:rgba(255,255,255,0.26); }
  .back-row{ display:flex; align-items:center; gap:10px; }
  .back-row .title{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; }

  /* ---------- bottom nav ---------- */
  .bottomnav{
    display:flex; background:var(--white); border-top:1px solid var(--line); flex-shrink:0;
    padding: 8px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer;
    color:var(--soil-light); padding:6px 2px; border-radius:12px; font-family:'Manrope';
  }
  .navitem .lbl{ font-size:10.5px; font-weight:700; }
  .navitem.active{ color:var(--forest); }
  .navitem.active .ic-wrap{ background:var(--marigold-light); }
  .ic-wrap{ width:34px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:10px; }

  /* ---------- generic content blocks ---------- */
  .px{ padding-left:20px; padding-right:20px; }
  .section{ padding:18px 20px 6px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .section-head h3{ font-family:'Fraunces', serif; font-size:16.5px; font-weight:600; color:var(--soil);}
  .section-head a{ font-size:12px; font-weight:700; color:var(--forest-soft); text-decoration:none; }

  .card{ background:var(--white); border-radius:var(--radius); padding:16px; border:1px solid var(--line); }
  .card + .card{ margin-top:12px; }
  .row{ display:flex; align-items:center; gap:12px; }
  .between{ justify-content:space-between; }
  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:5px 10px; border-radius:99px;
  }
  .chip.good{ background:var(--success-light); color:var(--success); }
  .chip.warn{ background:var(--marigold-light); color:var(--marigold-dark); }
  .chip.bad{ background:var(--danger-light); color:var(--danger); }
  .chip.sky{ background:#E4EEF0; color:var(--sky); }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Manrope'; font-weight:800; font-size:14px;
    border-radius:14px; padding:14px; border:none; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--forest); color:var(--white); }
  .btn-primary:active{ background:var(--forest-dark); }
  .btn-marigold{ background:var(--marigold); color:var(--soil); }
  .btn-ghost{ background:var(--paper); color:var(--soil); }
  .btn-outline{ background:transparent; color:var(--forest); border:1.5px solid var(--forest); }
  .btn.sm{ padding:9px 14px; font-size:12.5px; width:auto; border-radius:11px; }

  input, select, textarea{
    width:100%; border:1.5px solid var(--line); background:var(--white); border-radius:13px; padding:13px 14px;
    font-family:'Manrope'; font-size:14px; color:var(--soil); outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--forest-soft); }
  label.field-label{ font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--soil-light); margin-bottom:6px; display:block;}
  .field{ margin-bottom:14px; }
  .search-wrap{ position:relative; }
  .search-wrap input{ padding-left:42px; }
  .search-wrap .ic{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--soil-light);}

  .tag-scroll{ display:flex; gap:8px; overflow-x:auto; padding:2px 20px 4px; scrollbar-width:none; }
  .tag-scroll::-webkit-scrollbar{display:none;}
  .tag{ flex-shrink:0; padding:9px 15px; border-radius:99px; font-size:12.5px; font-weight:700; background:var(--white); border:1.5px solid var(--line); color:var(--soil-light); cursor:pointer; white-space:nowrap;}
  .tag.active{ background:var(--forest); border-color:var(--forest); color:var(--white); }

  .avatar{ width:44px; height:44px; border-radius:13px; background:var(--marigold-light); display:flex; align-items:center; justify-content:center; color:var(--marigold-dark); flex-shrink:0; font-weight:800; font-family:'Fraunces';}
  .avatar.round{ border-radius:50%; }
  .avatar.lg{ width:64px; height:64px; border-radius:18px; font-size:22px;}
  .avatar.round.lg{ border-radius:50%; }

  .divider{ height:1px; background:var(--line); margin:14px 0; }
  .muted{ color:var(--soil-light); }
  .fw8{font-weight:800;}
  .fw7{font-weight:700;}
  .fs11{font-size:11px;}
  .fs12{font-size:12px;}
  .fs13{font-size:13px;}
  .num{ font-family:'Space Mono', monospace; }

  .fab{
    position:absolute; right:18px; bottom:86px; width:54px; height:54px; border-radius:18px; background:var(--marigold);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px -4px rgba(200,127,30,0.55); border:none; color:var(--soil); z-index:30; cursor:pointer;
  }

  /* progress / stat bars */
  .barTrack{ height:8px; background:var(--paper); border-radius:99px; overflow:hidden; }
  .barFill{ height:100%; border-radius:99px; background:var(--forest-soft); }

  .empty{ text-align:center; padding:50px 30px; color:var(--soil-light); }
  .empty svg{ margin-bottom:14px; opacity:0.5;}

  .toast{
    position:absolute; left:20px; right:20px; bottom:96px; background:var(--soil); color:var(--white); padding:13px 16px; border-radius:14px;
    font-size:13px; font-weight:700; display:flex; align-items:center; gap:10px; z-index:80; box-shadow:var(--shadow);
    animation: rise 0.25s ease-out;
  }
  @keyframes rise{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }

  /* role badge on splash */
  .roleCard{ display:flex; align-items:center; gap:14px; background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:14px; cursor:pointer; }
  .roleCard:active{ border-color:var(--forest); background:var(--marigold-light); }
  .roleCard .ic-box{ width:46px; height:46px; border-radius:13px; background:var(--forest); display:flex; align-items:center; justify-content:center; color:var(--white); flex-shrink:0;}

  ::selection{ background:var(--marigold-light); }

  /* side panel: dev/nav helper outside phone */
  .panel{
    width:250px; background:var(--white); border-radius:20px; padding:18px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .panel h4{ font-family:'Fraunces'; font-size:15px; margin-bottom:4px; }
  .panel p.small{ font-size:12px; color:var(--soil-light); line-height:1.5; margin-bottom:14px;}
  .panel-btn{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; background:var(--paper); border:none; width:100%; text-align:left; font-family:'Manrope'; font-weight:700; font-size:12.5px; color:var(--soil); margin-bottom:8px; cursor:pointer;}
  .panel-btn.active{ background:var(--forest); color:#fff; }
  .panel-btn:last-child{margin-bottom:0;}

  @media (max-width: 700px){
    .stage{ transform-origin: top center; }
    .panel{ display:none; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="panel">
    <h4>FarmFusion</h4>
    <p class="small">Smart Agro‑Diary Ecosystem — clickable UI/UX prototype generated from the SRS. Switch role to preview a different dashboard, or jump to a screen.</p>
    <div id="roleSwitch"></div>
    <div class="divider"></div>
    <p class="small" style="margin-bottom:8px;">Jump to screen</p>
    <div id="jumpList"></div>
  </div>

  <div class="device">
    <div class="notch"></div>
    <div class="screen">
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span style="display:flex; gap:5px; align-items:center;">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
          <svg width="15" height="11" viewBox="0 0 24 17"><path d="M12 17c.5 0 1-.2 1.3-.6l2-2.5c-1.9-1.6-4.7-1.6-6.6 0l2 2.5c.3.4.8.6 1.3.6z" fill="currentColor"/><path d="M12 9c2.3 0 4.5.9 6.1 2.4l2-2.5C17.7 6.7 15 5.5 12 5.5S6.3 6.7 3.9 8.9l2 2.5C7.5 9.9 9.7 9 12 9z" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>
      <div class="app-body" id="appBody"></div>
      <div id="bottomNavHolder"></div>
    </div>
  </div>

</div>

<script>
/* ============================= ICONS ============================= */
function ic(name, size=20, stroke=2){
  const P = {
    home:'<path d="M4 11 12 4l8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>',
    cow:'<path d="M6 10c-1.5 0-2.5-1-2.5-2.2C3.5 6.6 4.4 6 5.3 6.4L7 7.5"/><path d="M18 10c1.5 0 2.5-1 2.5-2.2 0-1.2-.9-1.8-1.8-1.4L17 7.5"/><path d="M6.5 9.5C6.5 6.5 9 4.5 12 4.5s5.5 2 5.5 5c0 1.6-.6 2.6-1.3 3.6-.6.8-1 1.6-1 2.7V17c0 1.7-1.3 3-3 3h-.4c-1.7 0-3-1.3-3-3v-1.2c0-1.1-.4-1.9-1-2.7-.7-1-1.3-2-1.3-3.6Z"/><circle cx="10" cy="10.5" r=".6" fill="currentColor" stroke="none"/><circle cx="14" cy="11.5" r=".6" fill="currentColor" stroke="none"/>',
    droplet:'<path d="M12 3s6 6.6 6 10.5A6 6 0 0 1 6 13.5C6 9.6 12 3 12 3Z"/>',
    heart:'<path d="M12 20s-7.3-4.5-9.6-9C1 8 2.4 4.8 5.6 4.1c2-.4 3.7.5 4.9 2.1 1.2-1.6 3-2.5 4.9-2.1C18.6 4.8 20 8 18.6 11c-2.3 4.5-6.6 9-6.6 9Z"/><path d="M8 11h2l1.3-2 1.4 3.5L14 10h2"/>',
    wallet:'<rect x="3" y="6.5" width="18" height="12" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor" stroke="none"/>',
    chart:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
    leaf:'<path d="M5 19c9 0 14-5 14-14 0 0-11-1-14 6-2 4.5 0 8 0 8Z"/><path d="M5 19c0-4 2-8 5.5-10.5"/>',
    shop:'<path d="M4 8 5.5 4h13L20 8"/><path d="M4 8h16v10.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5V8Z"/><path d="M9 12a3 3 0 0 0 6 0"/>',
    cart:'<circle cx="9" cy="20" r="1.3" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.3" fill="currentColor" stroke="none"/><path d="M3 4h2l2.2 11.4a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.2L20 8H6"/>',
    user:'<circle cx="12" cy="8.3" r="3.3"/><path d="M5 19.5c1.4-3.6 4-5.2 7-5.2s5.6 1.6 7 5.2"/>',
    chat:'<path d="M4 12a8 8 0 1 1 3.5 6.6L4 20l1.2-3.8A7.9 7.9 0 0 1 4 12Z"/><circle cx="8.5" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="15.5" cy="12" r=".8" fill="currentColor" stroke="none"/>',
    bell:'<path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z"/><path d="M9.5 17.5a2.5 2.5 0 0 0 5 0"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/>',
    filter:'<path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/>',
    chevL:'<path d="M15 5 8 12l7 7"/>',
    chevR:'<path d="M9 5l7 7-7 7"/>',
    plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    check:'<path d="m4 12 6 6L20 6"/>',
    x:'<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
    camera:'<path d="M4 8h3l1.5-2.3h7L17 8h3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8Z"/><circle cx="12" cy="13.5" r="3.6"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m3 17 5.5-5.5c.8-.8 1.7-.8 2.5 0L18 18"/>',
    grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>',
    alert:'<path d="M12 3 22 20H2Z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".2" fill="currentColor" stroke="currentColor" stroke-width="2.4"/>',
    trend:'<path d="m3 16 6-6 4 4 8-9"/><path d="M15 5h6v6"/>',
    package:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>',
    mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>',
    send:'<path d="M4 12 20 4l-6.5 16-3-6.5L4 12Z"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.3 1.5h.3a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z"/>',
    logout:'<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    calendar:'<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/>',
    syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 5 8.5 15.5l-1 3.5-3.5 1 1-3.5L15.5 6Z"/><path d="m9 14 1 1"/><path d="m12 11 1 1"/>',
    feed:'<path d="M20 6H10a4 4 0 0 0-4 4v9"/><path d="M20 6v9a4 4 0 0 1-4 4h-5"/><path d="M4 12h4"/><circle cx="7" cy="6" r="2.5"/>',
    star:'<path d="m12 3 2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 17l-5.6 3.1 1.4-6.3L3 9.5l6.4-.6Z"/>',
    truck:'<rect x="2" y="7" width="12" height="10" rx="1"/><path d="M14 10h4l3 3.2V17h-7"/><circle cx="6.5" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/>',
    volume:'<path d="M5 9v6h4l5 4V5L9 9H5Z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6.5 9 6 9-6"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18"/><path d="M12 3a15 15 0 0 0 0 18"/>',
    flag:'<path d="M5 21V4"/><path d="M5 4h13l-3 4.5L18 13H5"/>',
    download:'<path d="M12 3v13"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    tag:'<path d="M20.6 12.3 12.3 20.6a2 2 0 0 1-2.8 0l-6.1-6.1a2 2 0 0 1 0-2.8L11.7 3.4A2 2 0 0 1 13.1 3h5.5A2.4 2.4 0 0 1 21 5.4v5.5a2 2 0 0 1-.4 1.4Z"/><circle cx="15.5" cy="8.5" r="1.3"/>'
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${P[name]||''}</svg>`;
}

/* ============================= STATE ============================= */
const state = {
  role: null,          // owner | worker | vet | customer
  screen: 'splash',
  history: [],
  cart: [],
  lang: 'en',
  selectedCow: null,
  selectedWorker: null,
  taskFilter: 'all',
};

const ROLES = {
  owner:    { label:'Farm Owner',        icon:'user',  tabs:['home','cows','finance','reports','more'] },
  worker:   { label:'Farm Worker',       icon:'feed',  tabs:['home','cows','feed','health','more'] },
  vet:      { label:'Veterinary Advisor',icon:'heart', tabs:['home','health','calendar','more'] },
  customer: { label:'Customer',          icon:'shop',  tabs:['shop','cart','orders','assistant','more'] },

/* ============================= HELPERS ============================= */
function go(screen, extra){ state.history.push(state.screen); if(extra) Object.assign(state, extra); state.screen = screen; render(); window._appBody && (window._appBody.scrollTop = 0); }
function back(){ state.screen = state.history.pop() || 'home'; render(); }
function setRole(r){ state.role = r; state.history=[]; go(ROLES[r].tabs[0]); }
function toast(msg){
  const body = document.getElementById('appBody');
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = ic('check',16)+`<span>${msg}</span>`;
  body.appendChild(t); setTimeout(()=>t.remove(), 1900);
}

function topbar({title, eyebrow, back:showBack, right}={}){
  return `<div class="topbar furrow">
    <div class="topbar-row">
      ${showBack ? `<div class="back-row"><button class="iconbtn" onclick="back()">${ic('chevL',20)}</button><div><div class="title">${title}</div></div></div>`
      : `<div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1></div>`}
      ${right||''}
    </div>
  </div>`;
}

function bottomNav(){
  if(!state.role) return '';
  const tabs = ROLES[state.role].tabs;
  return `<div class="bottomnav">
    ${tabs.map(t=>{
      const m = TAB_META[t];
      const active = state.screen===t;
      const badge = (t==='cart' && state.cart.length) ? `<span style="position:absolute;top:-2px;right:2px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;">${state.cart.length}</span>`:'';
      return `<button class="navitem ${active?'active':''}" onclick="go('${t}')">
        <span class="ic-wrap" style="position:relative;">${ic(m.icon,19)}${badge}</span>
        <span class="lbl">${m.label}</span>
      </button>`;
    }).join('')}
  </div>`;
}

/* mini svg line chart */
function lineChart(points, w=327, h=110, color='var(--forest)'){
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max-min)||1;
  const step = w/(points.length-1);
  const coords = points.map((p,i)=>[i*step, h - ((p-min)/range)*(h-18) - 8]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area = path + ` L${w},${h} L0,${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${coords[coords.length-1][0]}" cy="${coords[coords.length-1][1]}" r="4.5" fill="${color}"/>
  </svg>`;
}
function barChart(points,labels,w=327,h=120,color='var(--marigold)'){
  const max = Math.max(...points)||1; const bw = (w/points.length)*0.5; const gap=(w/points.length);
  return `<svg width="${w}" height="${h+18}" viewBox="0 0 ${w} ${h+18}">
    ${points.map((p,i)=>{
      const bh = (p/max)*(h-10); const x = i*gap + (gap-bw)/2; const y = h-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${i===points.length-1?'var(--forest)':color}" />
      <text x="${x+bw/2}" y="${h+14}" font-size="9" fill="var(--soil-light)" text-anchor="middle" font-family="Manrope">${labels[i]}</text>`;
    }).join('')}
  </svg>`;
}

  const items = state.cart.map(id=>PRODUCTS.find(p=>p.id===id));
  const grouped = {};
  items.forEach(p=>{ grouped[p.id] = grouped[p.id] ? {...grouped[p.id], qty:grouped[p.id].qty+1} : {...p, qty:1}; });
  const list = Object.values(grouped);
  const subtotal = list.reduce((s,p)=>s+p.price*p.qty,0);
  return `
  ${topbar({title:'Your cart', eyebrow:list.length+' item(s)'})}
  <div class="section" style="padding-top:14px;">
    ${list.map(p=>`
      <div class="card"><div class="row between">
        <div class="row"><div class="avatar" style="font-size:22px;">${p.emoji}</div><div><div class="fw8 fs13">${p.name}</div><div class="muted fs11">৳${p.price} × ${p.qty}</div></div></div>
        <div class="fw8 num">৳${p.price*p.qty}</div>
      </div></div>`).join('')}
  </div>
  <div class="section" style="padding-bottom:20px;">
    <div class="card">
      <div class="row between fs13"><span class="muted">Subtotal</span><span class="num">৳${subtotal}</span></div>
      <div class="row between fs13" style="margin-top:6px;"><span class="muted">Delivery</span><span class="num">৳40</span></div>
      <div class="row between fs13" style="margin-top:6px; color:var(--success);"><span class="fw7">AI loyalty discount</span><span class="num">− ৳25</span></div>
      <div class="divider"></div>
      <div class="row between"><span class="fw8">Total</span><span class="fw8 num" style="font-size:17px;">৳${subtotal+40-25}</span></div>
    </div>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="go('checkout')">Proceed to checkout</button>
  </div>`;
};

Screens.checkout = ()=>{
  const items = state.cart.map(id=>PRODUCTS.find(p=>p.id===id));
  const grouped = {}; items.forEach(p=>{ grouped[p.id] = grouped[p.id] ? {...grouped[p.id], qty:grouped[p.id].qty+1} : {...p, qty:1}; });
  const subtotal = Object.values(grouped).reduce((s,p)=>s+p.price*p.qty,0);
  return `
  ${topbar({title:'Checkout', back:true})}
  <div class="section" style="padding-top:14px;">
    <div class="field"><label class="field-label">Delivery address</label><input value="House 12, Rupganj Road, Sirajganj Sadar"/></div>
    <div class="field"><label class="field-label">Delivery slot</label><select><option>Today, 5–7 PM</option><option>Tomorrow, 8–10 AM</option></select></div>
    <div class="field"><label class="field-label">Payment method</label>
      <div class="roleCard" style="margin-bottom:8px; padding:12px;"><div class="ic-box" style="width:36px;height:36px; background:var(--forest-soft);">${ic('wallet',16)}</div><div class="fw7 fs13" style="flex:1;">bKash</div>${ic('check',16)}</div>
      <div class="roleCard" style="padding:12px; opacity:0.6;"><div class="ic-box" style="width:36px;height:36px; background:var(--soil-light);">${ic('wallet',16)}</div><div class="fw7 fs13" style="flex:1;">Cash on delivery</div></div>
    </div>
    <div class="card" style="background:var(--marigold-light); border:none;"><div class="row" style="align-items:flex-start; gap:8px;"><div style="color:var(--marigold-dark);">${ic('alert',15)}</div><div class="fs11" style="line-height:1.5;">AI fraud check: this order matches your usual pattern — no action needed.</div></div></div>
  </div>
  <div class="section" style="padding-bottom:20px;">
    <div class="card"><div class="row between"><span class="fw8">Total to pay</span><span class="fw8 num" style="font-size:17px;">৳${subtotal+15}</span></div></div>
    <button class="btn btn-marigold" style="margin-top:12px;" onclick="state.cart=[]; go('orderConfirm')">Place order</button>
  </div>`;
};

Screens.orderConfirm = ()=> `
  <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
    <div style="width:76px;height:76px; background:var(--success-light); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--success); margin-bottom:18px;">${ic('check',34,2.4)}</div>
    <div style="font-family:'Fraunces'; font-size:20px; font-weight:600;">Order confirmed!</div>
    <p class="muted fs13" style="margin-top:8px; line-height:1.6;">Your order #FF‑2291 will arrive today between 5–7 PM. You'll get an SMS update when it's out for delivery.</p>
    <button class="btn btn-primary" style="margin-top:24px;" onclick="go('orders')">Track my order</button>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="go('shop')">Continue shopping</button>

Screens.orders = ()=> `

      <div class="row between"><div class="fw8 fs13">Order #FF‑2291</div><span class="chip warn">Out for delivery</span></div>

    <div class="card">
      <div class="row between"><div class="fw8 fs13">Order #FF‑2264</div><span class="chip good">Delivered</span></div>

      <div class="row between"><div class="fw8 fs13">Order #FF‑2201</div><span class="chip good">Delivered</span></div>

Screens.orderTrack = ()=> `
  ${topbar({title:'Order #FF‑2291', back:true})}
  <div class="section" style="padding-top:16px;">
    <div class="card">
      ${[['Order placed',true],['Preparing at farm',true],['Out for delivery',true],['Delivered',false]].map(([t,done],i,arr)=>`
        <div class="row" style="align-items:flex-start; gap:12px; ${i<arr.length-1?'margin-bottom:16px;':''} position:relative;">
          <div style="width:26px;height:26px;border-radius:50%; background:${done?'var(--forest)':'var(--paper)'}; color:${done?'#fff':'var(--soil-light)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:2;">${done?ic('check',13):''}</div>
          ${i<arr.length-1?`<div style="position:absolute; left:12.5px; top:26px; width:1.5px; height:32px; background:${done?'var(--forest-soft)':'var(--line)'};"></div>`:''}
          <div class="fw7 fs13" style="padding-top:3px;">${t}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="row between"><div class="fw8 fs13">Delivery partner</div><span class="chip sky">${ic('truck',11)} On the way</span></div>
      <div class="muted fs12" style="margin-top:4px;">Rahim · Arriving in ~25 min</div>

/* ============================= RENDER ============================= */
function render(){
  const body = document.getElementById('appBody');
  window._appBody = body;
  const fn = Screens[state.screen] || Screens.home;
  body.innerHTML = fn();
  document.getElementById('bottomNavHolder').innerHTML = bottomNav();
  renderPanel();
}

function renderPanel(){
  const rs = document.getElementById('roleSwitch');
  rs.innerHTML = Object.keys(ROLES).map(r=>`<button class="panel-btn ${state.role===r?'active':''}" onclick="setRole('${r}')">${ROLES[r].label}</button>`).join('');
  const jl = document.getElementById('jumpList');
  const tabs = state.role ? ROLES[state.role].tabs : ['login'];
  jl.innerHTML = tabs.map(t=>`<button class="panel-btn ${state.screen===t?'active':''}" onclick="go('${t}')">${(TAB_META[t]?TAB_META[t].label:'Login')}</button>`).join('');
}

render();
</script>
</body>
</html>
